version: '3.8'

services:
  weekend-assistant:
    build: .
    container_name: weekend-assistant
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - TZ=Europe/Paris
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/cache-stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
